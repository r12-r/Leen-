<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Leen!</title>
    <!-- استيراد الخطوط المزخرفة والراقية من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght=700&family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* التوسيط المطلق الكامل للصفحة */
        body {
            background-color: #ffe5ec; /* خلفية زهر فاتح */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: #4a4a4a;
            overflow: hidden;
            position: relative;
        }

        /* إطار ذهبي ناعم حول الشاشة */
        body::before {
            content: "";
            position: absolute;
            top: 15px;
            bottom: 15px;
            left: 15px;
            right: 15px;
            border: 2px solid #dfb15b;
            border-radius: 10px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.6;
        }

        /* الحاوية المركزية لجميع العناصر */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
            width: 100%;
            max-width: 500px;
        }

        header {
            animation: fadeIn 2s ease-in-out;
            margin-bottom: 30px;
        }

        /* خط Happy Birthday ناعم ومتناسق */
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem; 
            color: #ff4d6d;
            margin: 0;
            line-height: 1.2;
        }

        .subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #c71585;
            margin-top: 5px;
        }

        /* منطقة المنتصف الثابتة للكبسة والقلب الجامبو */
        .center-area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 320px; 
            width: 100%;
            margin-bottom: 30px;
            position: relative;
        }

        /* تصميم الكبسة التفاعلية المشعة */
        .magic-btn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            border: none;
            padding: 15px 35px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
            transition: all 0.4s ease;
            z-index: 5;
            outline: none;
            animation: pulseBtn 2s infinite;
        }

        /* حاوية القلب الضخم - الحواف بنفس لون الخط تماماً */
        .heart-container {
            display: none; 
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 240px; 
            height: 240px;
            filter: drop-shadow(0 0 4px #c71585) 
                    drop-shadow(0 0 8px #ff4d6d);
        }

        .heart-container.show {
            display: flex;
            opacity: 1;
            transform: scale(1);
            animation: smoothFloat 4s ease-in-out infinite;
        }

        /* تصميم جسم القلب الأساسي بحجم كبير وضخم */
        .heart {
            background-color: #ff4d6d; 
            height: 160px; 
            width: 160px;
            position: relative;
            transform: rotate(-45deg);
        }

        /* الدوائر الجانبية للقلب الضخم */
        .heart:before, .heart:after {
            content: "";
            background-color: #ff4d6d;
            border-radius: 50%;
            height: 160px;
            width: 160px;
            position: absolute;
        }

        .heart:before {
            top: -80px;
            left: 0;
        }

        .heart:after {
            left: 80px;
            top: 0;
        }

        /* التعديل: رفع صندوق الكلمات قليلاً للأعلى ليقعد بالمنتصف المثالي للقلب */
        .message-box {
            position: absolute;
            z-index: 30;
            text-align: center;
            width: 200px; 
            color: white;
          font-family: 'Dancing Script', cursive;
            top: 33%; /* تم رفعها من 50% إلى 45% لتتوسط السنتر البصري للقلب */
            left: 50%; 
            transform: translate(-50%, -50%); 
            pointer-events: none;
        }

        .message-box p {
            font-size: 0.85rem; 
            line-height: 1.5; 
            margin: 0;
            font-weight: 400;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
        }

        /* التوقيع أسفل الصفحة */
        footer {
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem;
            color: #ff4d6d;
            font-weight: bold;
            letter-spacing: 1px;
            animation: fadeIn 2.5s ease-in-out;
        }

        /* --- قلوب الخلفية المتساقطة --- */
        .bg-heart {
            position: absolute;
            background-color: rgba(255, 77, 109, 0.08);
            display: inline-block;
            height: 15px;
            width: 15px;
            transform: rotate(-45deg);
            bottom: -20px;
            animation: floatUp 8s linear infinite;
        }
        .bg-heart:before, .bg-heart:after {
            content: "";
            background-color: rgba(255, 77, 109, 0.08);
            border-radius: 50%;
            height: 15px;
            width: 15px;
            position: absolute;
        }
        .bg-heart:before { top: -7.5px; left: 0; }
        .bg-heart:after { left: 7.5px; top: 0; }

        .h1 { left: 12%; animation-duration: 7s; }
        .h2 { left: 28%; animation-duration: 9s; animation-delay: 2s; }
        .h3 { left: 48%; animation-duration: 6s; animation-delay: 4s; }
        .h4 { left: 72%; animation-duration: 10s; animation-delay: 1s; }
        .h5 { left: 88%; animation-duration: 8s; animation-delay: 3s; }

        /* --- الحركات (Animations) --- */
        @keyframes smoothFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(-45deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-105vh) rotate(-45deg); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3), 0 0 0 0 rgba(255, 77, 109, 0.4); }
            70% { box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3), 0 0 0 12px rgba(255, 77, 109, 0); }
            100% { box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3), 0 0 0 0 rgba(255, 77, 109, 0); }
        }
    </style>
</head>
<body>

    <!-- قلوب الخلفية الطائرة -->
    <div class="bg-heart h1"></div>
    <div class="bg-heart h2"></div>
    <div class="bg-heart h3"></div>
    <div class="bg-heart h4"></div>
    <div class="bg-heart h5"></div>

    <div class="main-container">
        
        <!-- الهيدر الأنيق -->
        <header>
            <h1 class="title">Happy Birthday</h1>
            <div class="subtitle">Dearest Leen Youness</div>
        </header>

        <!-- منطقة المنتصف الثابتة للهاتف -->
        <div class="center-area">
            
            <!-- الكبسة -->
            <button class="magic-btn" id="revealBtn" onclick="revealMessage()">Open with Love ✨</button>

            <!-- حاوية القلب الضخم والجديد -->
            <div class="heart-container" id="heartWrapper">
                <div class="heart"></div>
                <div class="message-box">
                    <p>To my wonderful friend Leen,
                      wishing you a day as bright and beautiful as you are!
                      May this year bring you endless happiness.
                      Enjoy your special day!
                      i well not forget you my friend, my dir freind leen.
                    </p>
                </div>
            </div>

        </div>

        <!-- التوقيع -->
        <footer>
            From Rodwan to Leen 2026
        </footer>

    </div>

    <!-- كود التشغيل السلس -->
    <script>
        function revealMessage() {
            var btn = document.getElementById('revealBtn');
            var heart = document.getElementById('heartWrapper');
            
            btn.style.opacity = '0';
            btn.style.pointerEvents = 'none';
            
            setTimeout(function() {
                btn.style.display = 'none'; 
                heart.style.display = 'flex';
                setTimeout(function() {
                    heart.classList.add('show');
                }, 50);
            }, 400); 
        }
    </script>

</body>
</html>
